<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clima 24h</title>
<style>
  :root {
    --azul: #2563eb;
    --azul-escuro: #1d4ed8;
    --texto: #0f172a;
    --texto-suave: #64748b;
    --borda: #e2e8f0;
    --cartao: #ffffff;
    --vermelho: #dc2626;
    --verde: #0d9488;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    color: var(--texto);
    background: linear-gradient(160deg, #eff6ff 0%, #e0e7ff 45%, #f8fafc 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .painel { width: 100%; max-width: 760px; }

  header { text-align: center; margin-bottom: 28px; }

  h1 {
    margin: 0 0 8px;
    font-size: 2.1rem;
    letter-spacing: -0.02em;
  }

  .subtitulo {
    margin: 0;
    color: var(--texto-suave);
    font-size: 1rem;
  }

  form {
    display: flex;
    gap: 10px;
    background: var(--cartao);
    padding: 10px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }

  input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    padding: 14px 16px;
    font-size: 1rem;
    border-radius: 10px;
    background: transparent;
    color: var(--texto);
  }

  input::placeholder { color: #94a3b8; }

  button {
    border: none;
    padding: 14px 26px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--azul);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  button:hover:not(:disabled) { background: var(--azul-escuro); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  .sugestoes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 16px 0 4px;
  }

  .sugestao {
    border: 1px solid var(--borda);
    background: rgba(255, 255, 255, 0.7);
    color: var(--texto-suave);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .sugestao:hover { color: var(--azul); border-color: var(--azul); }

  .aviso {
    margin-top: 24px;
    padding: 16px 18px;
    border-radius: 12px;
    font-size: 0.95rem;
    text-align: center;
  }

  .aviso.erro {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
  }

  .aviso.carregando {
    background: var(--cartao);
    color: var(--texto-suave);
    border: 1px solid var(--borda);
  }

  .cartao {
    margin-top: 24px;
    background: var(--cartao);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }

  .local {
    font-size: 1.25rem;
    font-weight: 650;
    margin: 0;
  }

  .horario {
    margin: 4px 0 0;
    color: var(--texto-suave);
    font-size: 0.85rem;
  }

  .temperatura {
    font-size: 4rem;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    margin: 18px 0 4px;
  }

  .temperatura span { font-size: 1.6rem; color: var(--texto-suave); }

  .vento { margin: 0; color: var(--texto-suave); font-size: 0.9rem; }

  .indicadores {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-top: 24px;
  }

  .indicador {
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }

  .indicador dt {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--texto-suave);
    margin-bottom: 6px;
  }

  .indicador dd {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 650;
  }

  .indicador.maxima dd { color: var(--vermelho); }
  .indicador.minima dd { color: var(--verde); }

  .grafico {
    margin-top: 24px;
    width: 100%;
    border-radius: 12px;
    border: 1px solid var(--borda);
    display: block;
  }

  footer {
    margin-top: 28px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--texto-suave);
  }

  footer a { color: var(--azul); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="painel">
  <header>
    <h1>Clima 24h</h1>
    <p class="subtitulo">Temperatura atual e a evolução das últimas 24 horas em qualquer cidade do mundo.</p>
  </header>

  <form id="formulario">
    <input id="campo-cidade" type="text" placeholder="Digite o nome de uma cidade..."
           autocomplete="off" autofocus required>
    <button type="submit" id="botao">Buscar</button>
  </form>

  <div class="sugestoes" id="sugestoes">
    <button type="button" class="sugestao">Curitiba</button>
    <button type="button" class="sugestao">São Paulo</button>
    <button type="button" class="sugestao">Lisboa</button>
    <button type="button" class="sugestao">Tóquio</button>
    <button type="button" class="sugestao">Reykjavík</button>
  </div>

  <div id="aviso" class="aviso" hidden></div>

  <section id="resultado" class="cartao" hidden>
    <p class="local" id="local"></p>
    <p class="horario" id="horario"></p>
    <p class="temperatura" id="temperatura"></p>
    <p class="vento" id="vento"></p>

    <dl class="indicadores">
      <div class="indicador minima">
        <dt>Mínima 24h</dt>
        <dd id="minima"></dd>
      </div>
      <div class="indicador maxima">
        <dt>Máxima 24h</dt>
        <dd id="maxima"></dd>
      </div>
      <div class="indicador">
        <dt>Média 24h</dt>
        <dd id="media"></dd>
      </div>
      <div class="indicador">
        <dt>Chuva 24h</dt>
        <dd id="chuva"></dd>
      </div>
    </dl>

    <img id="grafico" class="grafico" alt="Gráfico da temperatura nas últimas 24 horas">
  </section>

  <footer>
    Dados da <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> ·
    <a href="/docs">Documentação da API</a>
  </footer>
</main>

<script>
  const formulario = document.getElementById("formulario");
  const campoCidade = document.getElementById("campo-cidade");
  const botao = document.getElementById("botao");
  const aviso = document.getElementById("aviso");
  const resultado = document.getElementById("resultado");
  const grafico = document.getElementById("grafico");

  function mostrarAviso(texto, tipo) {
    aviso.textContent = texto;
    aviso.className = "aviso " + tipo;
    aviso.hidden = false;
  }

  function esconderAviso() {
    aviso.hidden = true;
  }

  function formatarHorario(isoLocal) {
    const [data, hora] = isoLocal.split("T");
    const [ano, mes, dia] = data.split("-");
    return `Atualizado em ${dia}/${mes}/${ano} às ${hora}, horário local`;
  }

  function preencher(dados, cidadeConsultada) {
    const local = [dados.cidade, dados.pais].filter(Boolean).join(", ");
    document.getElementById("local").textContent = local;
    document.getElementById("horario").textContent = formatarHorario(dados.atual.hora_local);
    document.getElementById("temperatura").innerHTML =
      `${dados.atual.temperatura_c.toFixed(1)}<span> °C</span>`;
    document.getElementById("vento").textContent =
      `Vento de ${dados.atual.vento_kmh} km/h`;
    document.getElementById("minima").textContent =
      `${dados.resumo.temperatura_minima_c.toFixed(1)} °C`;
    document.getElementById("maxima").textContent =
      `${dados.resumo.temperatura_maxima_c.toFixed(1)} °C`;
    document.getElementById("media").textContent =
      `${dados.resumo.temperatura_media_c.toFixed(1)} °C`;
    document.getElementById("chuva").textContent =
      `${dados.resumo.precipitacao_total_mm.toFixed(1)} mm`;

    // O parâmetro extra evita que o navegador reaproveite o gráfico de uma
    // consulta anterior a partir do cache.
    grafico.src = `/clima-24h/grafico?nome_cidade=${encodeURIComponent(cidadeConsultada)}`
      + `&t=${Date.now()}`;

    resultado.hidden = false;
  }

  async function buscar(cidade) {
    esconderAviso();
    resultado.hidden = true;
    botao.disabled = true;
    mostrarAviso("Consultando o clima...", "carregando");

    try {
      const resposta = await fetch(`/clima-24h?nome_cidade=${encodeURIComponent(cidade)}`);
      const dados = await resposta.json();

      if (!resposta.ok) {
        throw new Error(dados.detail || "Não foi possível consultar o clima.");
      }

      preencher(dados, cidade);
      esconderAviso();
    } catch (erro) {
      mostrarAviso(erro.message, "erro");
    } finally {
      botao.disabled = false;
    }
  }

  formulario.addEventListener("submit", (evento) => {
    evento.preventDefault();
    const cidade = campoCidade.value.trim();
    if (cidade) {
      buscar(cidade);
    }
  });

  document.getElementById("sugestoes").addEventListener("click", (evento) => {
    if (evento.target.classList.contains("sugestao")) {
      campoCidade.value = evento.target.textContent;
      buscar(campoCidade.value);
    }
  });
</script>
</body>
</html>
